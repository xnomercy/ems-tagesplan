<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F4F7F6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#071F26" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Tagesplan">
  <meta name="robots" content="noindex, nofollow">
  <title>Tagesplan</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Anmeldung -->
  <section id="login" class="screen" hidden>
    <div class="login-box">
      <img src="ems-logo.png" alt="EMS IT Dienstleister" class="login-logo">
      <p class="eyebrow">Tagesplan</p>
      <h1>Klarer Tag.<br>Alles im Griff.</h1>
      <form id="login-form">
        <input id="login-email" type="email" autocomplete="username" placeholder="E-Mail" required>
        <div class="pw"><input id="login-pass" type="password" autocomplete="current-password" placeholder="Passwort" required><button type="button" class="eye" data-eye aria-label="Passwort anzeigen"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
        <button type="submit" class="primary">Anmelden</button>
      </form>
      <p id="login-msg" class="muted"></p>
    </div>
  </section>

  <!-- App -->
  <section id="app" class="screen" hidden>
    <header class="top">
      <img src="ems-mark.png" alt="" class="avatar">
      <div class="hello">
        <div id="greeting" class="h-name"></div>
        <div id="today-date" class="muted small"></div>
      </div>
      <button class="round-btn" id="add" aria-label="Neu anlegen">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </header>

    <main>
      <div id="view-heute" class="view"></div>
      <div id="view-termine" class="view" hidden></div>
      <div id="view-plan" class="view" hidden></div>
      <div id="view-mehr" class="view" hidden></div>
    </main>

    <nav class="tabs">
      <button data-view="heute" class="active" aria-label="Tag">
        <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Tag</span>
      </button>
      <button data-view="termine" aria-label="Termine">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Termine</span>
      </button>
      <div class="fab-slot">
        <button id="mic" class="fab" aria-label="Sprechen">
          <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
        </button>
      </div>
      <button data-view="plan" aria-label="Routinen">
        <svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg><span>Routinen</span>
      </button>
      <button data-view="mehr" aria-label="Mehr">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span>Mehr</span>
      </button>
    </nav>
  </section>

  <!-- Sprach-Blatt -->
  <dialog id="voice">
    <div class="voice-wrap">
      <button type="button" id="voice-close" class="sheet-close" aria-label="Schließen">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <p class="eyebrow">Sag einfach, was ansteht</p>
      <button type="button" id="voice-orb" class="orb" aria-label="Zuhören starten">
        <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
      </button>
      <div id="voice-state" class="muted small">Tippe zum Sprechen</div>
      <form id="cmd-form">
        <textarea id="cmd-input" rows="2" placeholder="Oder hier tippen bzw. das Tastatur-Mikro nutzen" enterkeyhint="send"></textarea>
        <div id="preview" class="preview" hidden></div>
        <button class="primary" id="cmd-run">Übernehmen</button>
      </form>
      <div class="examples">
        <button type="button">Leg Aufgabe an Steuer muss bis Freitag fertig sein</button>
        <button type="button">Täglich um 21 Uhr Buch lesen</button>
        <button type="button">Termin morgen um 15 Uhr Zahnarzt</button>
        <button type="button">Asr erledigt</button>
      </div>
    </div>
  </dialog>

  <!-- Formular zum Hinzufügen/Bearbeiten -->
  <dialog id="sheet">
    <form id="sheet-form" method="dialog"></form>
  </dialog>

  <div id="toast" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
